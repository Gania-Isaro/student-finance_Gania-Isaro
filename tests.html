<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Finance Tracker - Unit Tests</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/variables.css">
    <style>
        body {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            background: var(--background-body);
            color: var(--text-main);
        }

        .test-suite {
            margin-bottom: 2rem;
            background: var(--background-card);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        h1 {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.25rem;
            margin-top: 0;
            color: var(--primary-dark);
        }

        .test-case {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            font-family: monospace;
        }

        .test-case:last-child {
            border-bottom: none;
        }

        .status {
            font-weight: bold;
            text-transform: uppercase;
        }

        .pass {
            color: var(--success-color);
        }

        .fail {
            color: var(--danger-color);
        }

        .summary {
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <h1>🛠️ M3: Validation Unit Tests</h1>
    <div id="results">Running tests...</div>

    <script>
        // NOTE: For "file://" access without a local server, we are defining patterns here.
        // In a real production app with a server, we would import from './scripts/validators.js'.

        const Patterns = {
            description: /^\S+(?: \S+)*$/,
            amount: /^(0|[1-9]\d*)(\.\d{1,2})?$/,
            category: /^[A-Za-z]+(?:[ -][A-Za-z]+)*$/,
            date: /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/,
            duplicateWords: /\b(\w+)\s+\1\b/i
        };

        const validate = (field, value) => {
            if (!Patterns[field]) return false;
            return Patterns[field].test(value);
        };

        const resultsDiv = document.getElementById('results');
        let total = 0;
        let passed = 0;

        function assert(description, input, expected, validatorName) {
            total++;
            const isValid = validate(validatorName, input);
            const isPass = isValid === expected;
            if (isPass) passed++;

            return `
                <div class="test-case">
                    <span>${description} <br><small style="color:#666">Input: "${input}"</small></span>
                    <span class="status ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS' : 'FAIL'}</span>
                </div>
            `;
        }

        function runTests() {
            let html = '';

            // Test Suite 1: Description Validation
            html += '<div class="test-suite"><h2>1. Description Regex</h2>';
            html += assert('Valid simple text', 'Lunch', true, 'description');
            html += assert('Valid text with spaces', 'Lunch at cafeteria', true, 'description');
            html += assert('Invalid: Leading space', ' Lunch', false, 'description');
            html += assert('Invalid: Trailing space', 'Lunch ', false, 'description');
            html += assert('Invalid: Double spaces', 'Lunch  Break', false, 'description');
            html += '</div>';

            // Test Suite 2: Amount Validation
            html += '<div class="test-suite"><h2>2. Amount Regex</h2>';
            html += assert('Valid integer', '1200', true, 'amount');
            html += assert('Valid decimal', '12.50', true, 'amount');
            html += assert('Valid zero', '0', true, 'amount');
            html += assert('Invalid: Negative', '-10', false, 'amount');
            html += assert('Invalid: Many decimals', '10.555', false, 'amount');
            html += assert('Invalid: Leading zero', '05.00', false, 'amount');
            html += '</div>';

            // Test Suite 3: Advanced Regex
            html += '<div class="test-suite"><h2>3. Advanced: Duplicate Words</h2>';
            const dupPattern = Patterns.duplicateWords;

            total++;
            let isPass = dupPattern.test("Coffee Coffee");
            if (isPass) passed++;
            html += `<div class="test-case"><span>Catches duplicate "Coffee Coffee"</span><span class="status ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS' : 'FAIL'}</span></div>`;

            total++;
            isPass = !dupPattern.test("Coffee Tea");
            if (isPass) passed++;
            html += `<div class="test-case"><span>Ignores unique "Coffee Tea"</span><span class="status ${isPass ? 'pass' : 'fail'}">${isPass ? 'PASS' : 'FAIL'}</span></div>`;
            html += '</div>';

            html += `<div class="summary">Total Tests: ${total} | Passed: <span class="pass">${passed}</span> | Failed: <span class="fail">${total - passed}</span></div>`;

            resultsDiv.innerHTML = html;
        }

        // Run immediately
        runTests();
    </script>
</body>

</html>
