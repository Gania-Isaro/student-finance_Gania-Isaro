<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Finance Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<header>
    <h1>Student Finance Tracker</h1>
</header>

<nav>
    <button id="about-btn">About</button>
</nav>

<main id="main">

<section id="dashboard">
    <h2>Dashboard</h2>
    <p>Total Records: <span id="total-count">0</span></p>
    <p>Total Amount: <span id="total-amount">0</span></p>
    <p>Top Category: <span id="top-category">None</span></p>
    <div id="last-7-days"></div>

    <p id="cap-message" role="status" aria-live="polite"></p>
</section>

<section id="form-section">
    <h2>Add / Edit Expense</h2>

    <form id="expense-form">

        <label>Description
            <input type="text" id="description" required>
            <small class="error" id="desc-error"></small>
        </label>

        <label>Amount
            <input type="text" id="amount" required>
            <small class="error" id="amount-error"></small>
        </label>

        <label>Category
            <input type="text" id="category" required>
            <small class="error" id="category-error"></small>
        </label>

        <label>Date
            <input type="date" id="date" required>
            <small class="error" id="date-error"></small>
        </label>

        <button type="submit">Save</button>

    </form>
</section>

<section>
    <h2>Search</h2>

    <input type="text" id="search-input" placeholder="Regex search">
    <label>
        <input type="checkbox" id="case-checkbox">
        Case Insensitive
    </label>
</section>

<section>
    <h2>Records</h2>

    <div class="sort-buttons">
        <button id="sort-date">Sort by Date</button>
        <button id="sort-desc">Sort A-Z</button>
        <button id="sort-amount">Sort by Amount</button>
    </div>

    <table id="records-table">
        <thead>
            <tr>
                <th>Description</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</section>

<section id="settings">
    <h2>Settings</h2>

    <label>Spending Cap
        <input type="number" id="cap-input">
    </label>

    <button id="export-btn">Export JSON</button>
    <input type="file" id="import-file">
</section>

</main>

<footer>
    <p>Created by Your Name | GitHub: your-link | Email: your@email.com</p>
</footer>

<script type="module" src="scripts/app.js"></script>

</body>
</html>
